name: Deploy project page

# Publishes site/ to GitHub Pages. The bus itself is a Cloudflare Worker and is
# deployed separately with `npm run deploy` — these two surfaces share a domain
# but nothing else (see docs/DEPLOY.md).
on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        # Creates the Pages site on the first run instead of failing when the
        # repository has never had Pages enabled. Without this, a fresh clone of
        # this repo needs someone to flip Settings -> Pages -> Source first.
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
